<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reflection Prompt Debug</title>
<style>
  :root {
    --bg: #1c1a17;
    --panel: #26231f;
    --edge: #3a352e;
    --text: #ece5da;
    --muted: #9a9186;
    --accent: #F5CCA3;
    --accent-dim: #7a6a55;
    --err: #e0736a;
    --ok: #cfc7ba;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 14px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  h1 .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 10px; }

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .bar .spacer { flex: 1; }
  label.field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=password] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 6px 8px;
    font: 12px var(--mono);
  }
  input#key { width: 230px; }
  input#model { width: 150px; }
  button#send {
    background: var(--accent);
    color: #2a2118;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  button#send:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 12px; min-width: 90px; }

  .prompt-wrap { display: flex; flex-direction: column; gap: 5px; }
  .prompt-wrap label { color: var(--muted); font-size: 12px; }
  textarea {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.55 var(--mono);
    resize: vertical;
    width: 100%;
  }
  textarea#prompt { height: 260px; }

  .cols { display: flex; gap: 14px; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-height: 0; }
  .col label { color: var(--muted); font-size: 12px; }
  textarea#inputs { flex: 1; min-height: 220px; }

  #outputs {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    padding: 8px;
    min-height: 220px;
  }
  .row {
    border-bottom: 1px solid var(--edge);
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .row:last-child { border-bottom: none; }
  .row .in { color: var(--muted); font-size: 12px; }
  .row .exp { font-size: 11px; color: var(--accent-dim); font-family: var(--mono); }
  .row .out { font-size: 14px; display: flex; align-items: baseline; gap: 8px; }
  .row .out .text { flex: 1; }
  .row .out .text.pending { color: var(--accent-dim); font-style: italic; }
  .row .out .text.err { color: var(--err); }
  .row .out .text.empty { color: var(--muted); font-style: italic; }
  .row .p {
    font: 11px var(--mono);
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    padding: 1px 5px;
    white-space: nowrap;
  }
  .hint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Reflection Prompt Debug <span class="sub">edit the prompt · fire test inputs · read the reflections</span></h1>
    <div class="spacer"></div>
    <label class="field">key <input id="key" type="password" placeholder="claudeKey" autocomplete="off" /></label>
    <label class="field">model <input id="model" type="text" value="claude-haiku-4-5" /></label>
    <button id="send">Send through</button>
    <span class="status" id="status"></span>
  </div>

  <div class="prompt-wrap">
    <label>System prompt (editable — paste a winner back into <code>reflectionStream.js</code> when found)</label>
    <textarea id="prompt" spellcheck="false"></textarea>
  </div>

  <div class="cols">
    <div class="col">
      <label>Inputs — one sentence per line</label>
      <textarea id="inputs" spellcheck="false"></textarea>
    </div>
    <div class="col">
      <label>Outputs <span class="hint">(reflected + profundity · runs 5 at a time)</span></label>
      <div id="outputs"></div>
    </div>
  </div>

<script type="module">
// ── Reflection prompt bench ──────────────────────────────────
// Run it:  npm run dev   →   http://localhost:5173/tools/debug.html
//
// Lives in tools/ rather than public/ so it is NOT copied into dist/ and never
// ships with the app. It is still served from the Vite root in dev, so it shares
// an origin with the app running on the same port.
//
// The key field prefills from the app's own localStorage when there is something
// saved for this origin; otherwise just paste a key into the box.
//
// ── Defaults ─────────────────────────────────────────────────
// The prompt comes from the single source of truth. Edit it in the textarea
// to experiment; paste a winner back into src/services/reflection-prompt.js.
import { SYSTEM_PROMPT } from '/src/services/reflection-prompt.js';

// The 4 sentences that used to fail at 24/28 — three reported-speech / past-
// narration frames where the subject "You" wrongly went to "They", plus one
// object slip. They stay here as the regression set; expectations below are
// written in the you-form the prompt above now targets. Expected outputs are
// shown in the UI for at-a-glance judging.
const DEFAULT_INPUTS = [
  "You promised you would change.",
  "You promised me you would change.",
  "She told me I was too much.",
  "You always make me feel small.",
];

// Keyed by input — what a correct transform should produce.
const EXPECTED = {
  "You promised you would change.":    "I promised I would change.",
  "You promised me you would change.": "I promised you I would change.",
  "She told me I was too much.":       "She told you you were too much.",
  "You always make me feel small.":    "I always make you feel small.",
};

// ── Call shape mirrors reflectionStream.js reflectSentence ───
const ANTHROPIC_URL = 'https://api.anthropic.com/v1/messages';
const MAX_TOKENS = 150;
const CONCURRENCY = 5;

const $ = (id) => document.getElementById(id);
const promptEl = $('prompt');
const inputsEl = $('inputs');
const outputsEl = $('outputs');
const keyEl = $('key');
const modelEl = $('model');
const sendBtn = $('send');
const statusEl = $('status');

// Prefill from the same localStorage the app uses.
promptEl.value = SYSTEM_PROMPT;
inputsEl.value = DEFAULT_INPUTS.join('\n');
try {
  const s = JSON.parse(localStorage.getItem('aporius_settings') || '{}');
  if (s.claudeKey) keyEl.value = s.claudeKey;
} catch (_) { /* ignore */ }

// Tolerant JSON extraction — same as production: bare JSON expected, but pull
// the {...} out if the model wraps it in prose.
function extractJson(text) {
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if (start === -1 || end === -1 || end < start) throw new Error('no JSON object in reply');
  return JSON.parse(text.slice(start, end + 1));
}

async function reflectOne({ apiKey, model, systemPrompt, sentence }) {
  const response = await fetch(ANTHROPIC_URL, {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model,
      temperature: 0,
      max_tokens: MAX_TOKENS,
      system: systemPrompt,
      messages: [{ role: 'user', content: sentence }],
    }),
  });
  if (!response.ok) {
    let detail = '';
    try { detail = (await response.json()).error?.message || ''; } catch (_) {}
    throw new Error(`HTTP ${response.status}${detail ? ': ' + detail : ''}`);
  }
  const data = await response.json();
  const parsed = extractJson(data.content[0].text);
  return {
    reflected: typeof parsed.reflected === 'string' ? parsed.reflected.trim() : '',
    profundity: parsed.profundity,
  };
}

// Build a pending row per input; return the {text, badge} elements to fill later.
function buildRows(lines) {
  outputsEl.innerHTML = '';
  return lines.map((line) => {
    const row = document.createElement('div');
    row.className = 'row';

    const inEl = document.createElement('div');
    inEl.className = 'in';
    inEl.textContent = line;

    const outEl = document.createElement('div');
    outEl.className = 'out';
    const textEl = document.createElement('span');
    textEl.className = 'text pending';
    textEl.textContent = '…';
    const badge = document.createElement('span');
    badge.className = 'p';
    badge.style.visibility = 'hidden';
    badge.textContent = 'p=?';
    outEl.append(textEl, badge);

    row.append(inEl, outEl);
    if (EXPECTED[line]) {
      const expEl = document.createElement('div');
      expEl.className = 'exp';
      expEl.textContent = 'want: ' + EXPECTED[line];
      row.appendChild(expEl);
    }
    outputsEl.appendChild(row);
    return { textEl, badge };
  });
}

function fillOk(cell, result) {
  cell.textEl.className = 'text' + (result.reflected ? '' : ' empty');
  cell.textEl.textContent = result.reflected || '(empty — filler)';
  if (Number.isFinite(result.profundity)) {
    cell.badge.textContent = 'p=' + result.profundity;
    cell.badge.style.visibility = 'visible';
  }
}

function fillErr(cell, err) {
  cell.textEl.className = 'text err';
  cell.textEl.textContent = '✗ ' + (err?.message || String(err));
}

async function run() {
  const apiKey = keyEl.value.trim();
  if (!apiKey) { statusEl.textContent = 'no key'; keyEl.focus(); return; }
  const model = modelEl.value.trim() || 'claude-haiku-4-5';
  const systemPrompt = promptEl.value;
  const lines = inputsEl.value.split('\n').map((l) => l.trim()).filter(Boolean);
  if (!lines.length) { statusEl.textContent = 'no inputs'; return; }

  sendBtn.disabled = true;
  const cells = buildRows(lines);
  let done = 0;
  statusEl.textContent = `0/${lines.length}`;

  // Worker pool: at most CONCURRENCY requests in flight at once.
  let next = 0;
  async function worker() {
    while (next < lines.length) {
      const i = next++;
      try {
        const result = await reflectOne({ apiKey, model, systemPrompt, sentence: lines[i] });
        fillOk(cells[i], result);
      } catch (err) {
        fillErr(cells[i], err);
      }
      done++;
      statusEl.textContent = `${done}/${lines.length}`;
    }
  }

  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, lines.length) }, worker));
  statusEl.textContent = `done · ${lines.length}`;
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', run);
</script>
</body>
</html>
